# -----------------------------------------------------------------------------
# Marketplace Service - production profile
#
# Production stays PostgreSQL-backed and expects infrastructure to inject all
# network endpoints and credentials.
# -----------------------------------------------------------------------------

spring.datasource.url=${MARKETPLACE_DB_URL:${DB_URL}}
spring.datasource.username=${MARKETPLACE_DB_USERNAME:${DB_USERNAME}}
spring.datasource.password=${MARKETPLACE_DB_PASSWORD:${DB_PASSWORD}}
spring.flyway.locations=classpath:db/migration-postgresql

app.web.allowed-origin=${SHARITY_WEB_ALLOWED_ORIGIN}
app.jwt.public-key-path=${JWT_PUBLIC_KEY_PATH}
app.jwt.issuer=${AUTH_ISSUER_URL}
app.internal.service-token=${INTERNAL_SERVICE_TOKEN}
app.services.authorization-provider-eligibility-url=${AUTH_PROVIDER_ELIGIBILITY_INTERNAL_URL}
app.services.payment-internal-url=${PAYMENT_SERVICE_INTERNAL_URL}
