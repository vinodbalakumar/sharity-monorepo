server:
  port: ${SERVER_PORT:8084}
  forward-headers-strategy: framework
  servlet:
    context-path: /marketplace-service

spring:
  application:
    name: marketplace-service
  datasource:
    url: jdbc:mysql://${MARKETPLACE_DB_HOST:${DB_HOST:localhost}}:${MARKETPLACE_DB_PORT:${DB_PORT:3306}}/${MARKETPLACE_DB_NAME:marketplace_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MARKETPLACE_DB_USERNAME:${DB_USERNAME:root}}
    password: ${MARKETPLACE_DB_PASSWORD:${DB_PASSWORD:root}}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

app:
  jwt:
    public-key-path: ${JWT_PUBLIC_KEY_PATH:}
    issuer: ${AUTH_ISSUER_URL:authorization-server}
    audience: ${JWT_AUDIENCE:MARKETPLACE_API}
  internal:
    service-token: ${INTERNAL_SERVICE_TOKEN:local-dev-internal-token}
  services:
    authorization-provider-eligibility-url: ${AUTH_PROVIDER_ELIGIBILITY_INTERNAL_URL:http://authorization-server:8080/authorization-server/api/internal/api/v1}
    payment-internal-url: ${PAYMENT_SERVICE_INTERNAL_URL:http://payment-service:8080/payment-service/internal/api/v1}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
