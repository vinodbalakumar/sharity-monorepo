server:
  port: ${SERVER_PORT:8084}
  forward-headers-strategy: framework
  servlet:
    context-path: /marketplace-service

spring:
  application:
    name: marketplace-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local,mysql}
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false
    out-of-order: true
  jpa:
    hibernate:
      ddl-auto: ${MARKETPLACE_JPA_DDL_AUTO:validate}
    open-in-view: false

app:
  jwt:
    public-key-path: ${JWT_PUBLIC_KEY_PATH:c:/data/certs/jwt-public.pem}
    issuer: ${AUTH_ISSUER_URL:http://localhost:8083/authorization-server/api}
    audience: ${JWT_AUDIENCE:MARKETPLACE_API}
  internal:
    service-token: ${INTERNAL_SERVICE_TOKEN:local-dev-internal-token}
  services:
    authorization-provider-eligibility-url: ${AUTH_PROVIDER_ELIGIBILITY_INTERNAL_URL:http://localhost:8083/authorization-server/api/internal/api/v1}
    payment-internal-url: ${PAYMENT_SERVICE_INTERNAL_URL:http://localhost:8085/payment-service/internal/api/v1}
  assets:
    provider-code: ${ASSET_STORAGE_PROVIDER_CODE:CLOUDFLARE_R2_PRIMARY}
    bucket-name: ${ASSET_STORAGE_BUCKET_NAME:sharity-assets}
    endpoint-url: ${ASSET_STORAGE_ENDPOINT_URL:}
    public-base-url: ${ASSET_STORAGE_PUBLIC_BASE_URL:}
    region: ${ASSET_STORAGE_REGION:auto}
    access-key-id: ${ASSET_STORAGE_ACCESS_KEY_ID:}
    secret-access-key: ${ASSET_STORAGE_SECRET_ACCESS_KEY:}
    max-file-size-bytes: ${ASSET_UPLOAD_MAX_FILE_SIZE_BYTES:5242880}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
