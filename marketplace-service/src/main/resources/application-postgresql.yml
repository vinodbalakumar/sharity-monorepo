spring:
  datasource:
    url: ${MARKETPLACE_DB_URL:${DB_URL:jdbc:postgresql://${MARKETPLACE_DB_HOST:${DB_HOST:localhost}}:${MARKETPLACE_DB_PORT:${DB_PORT:5432}}/${MARKETPLACE_DB_NAME:marketplace_db}}}
    username: ${MARKETPLACE_DB_USERNAME:${DB_USERNAME:postgres}}
    password: ${MARKETPLACE_DB_PASSWORD:${DB_PASSWORD:postgres}}
  flyway:
    enabled: ${MARKETPLACE_FLYWAY_ENABLED:true}
    locations: classpath:db/migration-postgresql