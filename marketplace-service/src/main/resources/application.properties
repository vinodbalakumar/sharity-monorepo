# -----------------------------------------------------------------------------
# Marketplace Service - shared defaults
#
# Shared settings are followed by an isolated local-profile document.
# External QA and production profiles retain their environment-specific overrides.
# -----------------------------------------------------------------------------

server.port=${SERVER_PORT:${marketplace.local.server-port:8084}}
server.forward-headers-strategy=framework
server.servlet.context-path=/marketplace-service

spring.application.name=marketplace-service
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
spring.datasource.url=${MARKETPLACE_DB_URL:${marketplace.local.database-url}}
spring.datasource.username=${MARKETPLACE_DB_USERNAME:${marketplace.local.database-username}}
spring.datasource.password=${MARKETPLACE_DB_PASSWORD:postgres}
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.out-of-order=true
spring.jpa.hibernate.ddl-auto=${MARKETPLACE_JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
app.marketplace.query-slow-logging-enabled=${MARKETPLACE_SLOW_QUERY_LOGGING_ENABLED:false}
app.marketplace.query-slow-query-threshold-ms=${MARKETPLACE_SLOW_QUERY_THRESHOLD_MS:500}

# Shared auth contract for JWT validation.
app.jwt.public-key-base64=${APP_JWT_PUBLIC_KEY_BASE64:}
app.jwt.audience=${JWT_AUDIENCE:MARKETPLACE_API}

# Shared asset storage contract. Real values still come from env variables.
app.assets.provider-code=${ASSET_STORAGE_PROVIDER_CODE:CLOUDFLARE_R2_PRIMARY}
app.assets.bucket-name=${ASSET_STORAGE_BUCKET_NAME:sharity-assets}
app.assets.endpoint-url=${ASSET_STORAGE_ENDPOINT_URL:}
app.assets.public-base-url=${ASSET_STORAGE_PUBLIC_BASE_URL:https://pub-c431ffbb16cd4884aa6a22a5f177f00b.r2.dev}
app.assets.region=${ASSET_STORAGE_REGION:auto}
app.assets.access-key-id=${ASSET_STORAGE_ACCESS_KEY_ID:}
app.assets.secret-access-key=${ASSET_STORAGE_SECRET_ACCESS_KEY:}
app.assets.max-file-size-bytes=${ASSET_UPLOAD_MAX_FILE_SIZE_BYTES:5242880}

# Country lookups come from authorization so marketplace pricing can show shopper-local currency.
app.services.authorization-country-url=${AUTHORIZATION_COUNTRY_URL:${marketplace.local.authorization-country-url:}}

springdoc.swagger-ui.path=/swagger-ui.html

# Shared diagnostic delivery: metadata only; no AI calls on customer request threads.
app.diagnostics.enabled=${DIAGNOSTICS_ENABLED:false}
app.diagnostics.url=${DIAGNOSTICS_URL:http://localhost:8086/internal/diagnostics/events}
app.diagnostics.token=${DIAGNOSTICS_TOKEN:}
server.error.include-message=never
server.error.include-stacktrace=never

# Optional trace export; configure a private collector before enabling.
app.commerce.demo-purchases-enabled=${COMMERCE_DEMO_PURCHASES_ENABLED:${marketplace.local.demo-purchases-enabled:false}}
management.tracing.sampling.probability=${TRACING_SAMPLE_PROBABILITY:0.1}
management.tracing.export.otlp.enabled=${OTEL_EXPORT_ENABLED:false}
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
logging.structured.format.console=logstash

management.otlp.metrics.export.enabled=${OTEL_EXPORT_ENABLED:false}
management.otlp.metrics.export.url=${OTEL_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
management.logging.export.otlp.enabled=${OTEL_EXPORT_ENABLED:false}
management.opentelemetry.logging.export.otlp.endpoint=${OTEL_LOGS_ENDPOINT:http://localhost:4318/v1/logs}

app.diagnostics.slow-ms=${DIAGNOSTICS_SLOW_MS:2000}

# Local fallbacks are unavailable when only QA or production is active.
# Database credentials and the matching authorization-server public key stay external.

#---
spring.config.activate.on-profile=local
spring.config.import=optional:file:${user.home}/.sharity/local-internal-service.properties
marketplace.local.server-port=9094
marketplace.local.demo-purchases-enabled=true
marketplace.local.database-url=jdbc:postgresql://localhost:5432/test1
marketplace.local.database-username=postgres
marketplace.local.authorization-country-url=http://localhost:9093/authorization-server/api/internal/api/v1
spring.flyway.locations=classpath:db/migration-postgresql

app.web.allowed-origin=${SHARITY_WEB_ALLOWED_ORIGIN:http://localhost:9173,http://localhost:9174}
app.jwt.public-key-path=${JWT_PUBLIC_KEY_PATH:}
app.jwt.issuer=${AUTH_ISSUER_URL:http://localhost:9093/authorization-server/api}
app.internal.service-token=${APP_INTERNAL_SERVICE_TOKEN:}
app.services.authorization-provider-eligibility-url=${AUTH_PROVIDER_ELIGIBILITY_INTERNAL_URL:http://localhost:9093/authorization-server/api/internal/api/v1}
app.services.payment-internal-url=${PAYMENT_SERVICE_INTERNAL_URL:http://localhost:9095/payment-service/internal/api/v1}
