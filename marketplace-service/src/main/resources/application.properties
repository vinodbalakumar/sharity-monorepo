# -----------------------------------------------------------------------------
# Marketplace Service - shared defaults
#
# This base file keeps only the settings that are stable in every environment.
# Hostnames, database vendor, and deployment-specific URLs live in the profile
# files so new team members can quickly see what changes per environment.
# -----------------------------------------------------------------------------

server.port=${SERVER_PORT:8084}
server.forward-headers-strategy=framework
server.servlet.context-path=/marketplace-service

spring.application.name=marketplace-service
spring.profiles.active=${SPRING_PROFILES_ACTIVE:qa}
spring.datasource.url=${MARKETPLACE_DB_URL}
spring.datasource.username=${MARKETPLACE_DB_USERNAME}
spring.datasource.password=${MARKETPLACE_DB_PASSWORD}
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.out-of-order=true
spring.jpa.hibernate.ddl-auto=${MARKETPLACE_JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
app.marketplace.query-slow-logging-enabled=${MARKETPLACE_SLOW_QUERY_LOGGING_ENABLED:false}
app.marketplace.query-slow-query-threshold-ms=${MARKETPLACE_SLOW_QUERY_THRESHOLD_MS:500}

# Shared auth contract for JWT validation.
app.jwt.audience=${JWT_AUDIENCE:MARKETPLACE_API}

# Shared asset storage contract. Real values still come from env variables.
app.assets.provider-code=${ASSET_STORAGE_PROVIDER_CODE:CLOUDFLARE_R2_PRIMARY}
app.assets.bucket-name=${ASSET_STORAGE_BUCKET_NAME:sharity-assets}
app.assets.endpoint-url=${ASSET_STORAGE_ENDPOINT_URL:}
app.assets.public-base-url=${ASSET_STORAGE_PUBLIC_BASE_URL:}
app.assets.region=${ASSET_STORAGE_REGION:auto}
app.assets.access-key-id=${ASSET_STORAGE_ACCESS_KEY_ID:}
app.assets.secret-access-key=${ASSET_STORAGE_SECRET_ACCESS_KEY:}
app.assets.max-file-size-bytes=${ASSET_UPLOAD_MAX_FILE_SIZE_BYTES:5242880}

# Country lookups come from authorization so marketplace pricing can show shopper-local currency.
app.services.authorization-country-url=${AUTHORIZATION_COUNTRY_URL:}

springdoc.swagger-ui.path=/swagger-ui.html
