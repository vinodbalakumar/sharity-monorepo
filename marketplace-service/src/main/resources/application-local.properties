# -----------------------------------------------------------------------------
# Marketplace Service - local developer profile
#
# Local development uses PostgreSQL in this workspace and localhost URLs for the
# dependent services.
# -----------------------------------------------------------------------------

server.port=9094

spring.datasource.url=jdbc:postgresql://localhost:5432/marketplace_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.flyway.locations=classpath:db/migration-postgresql

app.web.allowed-origin=http://localhost:9173,http://localhost:9174
app.jwt.public-key-path=c:/data/certs/jwt-public.pem
app.jwt.issuer=http://localhost:9093/authorization-server/api
app.internal.service-token=local-dev-internal-token
app.services.authorization-provider-eligibility-url=http://localhost:9093/authorization-server/api/internal/api/v1
app.services.payment-internal-url=http://localhost:9095/payment-service/internal/api/v1
