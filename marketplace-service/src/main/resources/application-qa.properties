# -----------------------------------------------------------------------------
# Marketplace Service - QA profile
#
# QA uses MySQL in this workspace for environment separation.
# -----------------------------------------------------------------------------

spring.datasource.url=jdbc:mysql://localhost:3306/marketplace_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.flyway.locations=classpath:db/migration

app.web.allowed-origin=http://localhost:3000
app.jwt.public-key-path=c:/data/certs/jwt-public.pem
app.jwt.issuer=http://localhost:8083/authorization-server/api
app.internal.service-token=local-dev-internal-token
app.services.authorization-provider-eligibility-url=http://localhost:8083/authorization-server/api/internal/api/v1
app.services.payment-internal-url=http://localhost:8085/payment-service/internal/api/v1
