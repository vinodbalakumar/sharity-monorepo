# -----------------------------------------------------------------------------
# Marketplace Service - QA profile
#
# QA uses MySQL in this workspace for environment separation.
# -----------------------------------------------------------------------------

spring.flyway.locations=classpath:db/migration

app.web.allowed-origin=https://vinodbalakumar.com
app.jwt.public-key-path=/keys/jwt-public.pem
app.jwt.issuer=https://vinodbalakumar.com/authorization-server/api
app.internal.service-token=local-dev-internal-token
app.services.authorization-provider-eligibility-url=https://vinodbalakumar.com/authorization-server/api/internal/api/v1
app.services.authorization-country-url=https://vinodbalakumar.com/authorization-server/api/internal/api/v1
app.services.payment-internal-url=https://vinodbalakumar.com/payment-service/internal/api/v1
app.marketplace.query-slow-logging-enabled=true
app.marketplace.query-slow-query-threshold-ms=500
