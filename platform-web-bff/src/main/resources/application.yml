server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        name: SHARITY_SESSION
        http-only: true
        secure: ${BFF_SESSION_COOKIE_SECURE:true}
        same-site: Lax
        path: /

spring:
  application:
    name: platform-web-bff
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${BFF_DB_NAME:platform_web_bff}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: platform_web_bff_flyway_schema_history
    baseline-on-migrate: true
    baseline-version: 0
  security:
    oauth2:
      client:
        registration:
          sharity-web-bff:
            client-id: ${SHARITY_WEB_BFF_CLIENT_ID:sharity-web-bff}
            client-secret: ${SHARITY_WEB_BFF_CLIENT_SECRET:change-me-local-only}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_basic
            redirect-uri: ${SHARITY_BFF_PUBLIC_BASE_URL:https://vinodbalakumar.com}/login/oauth2/code/sharity-web-bff
            scope:
              - openid
              - profile
        provider:
          sharity-web-bff:
            authorization-uri: ${AUTH_SERVER_PUBLIC_BASE_URL:https://vinodbalakumar.com/authorization-server/api}/oauth2/authorize
            token-uri: ${AUTH_SERVER_BASE_URL:http://localhost:8083/authorization-server/api}/oauth2/token
            user-info-uri: ${AUTH_SERVER_BASE_URL:http://localhost:8083/authorization-server/api}/userinfo
            jwk-set-uri: ${AUTH_SERVER_BASE_URL:http://localhost:8083/authorization-server/api}/oauth2/jwks
            user-name-attribute: sub

app:
  security:
    allowed-origin: ${SHARITY_WEB_ALLOWED_ORIGIN:https://vinodbalakumar.com}
  oauth2:
    client-id: ${SHARITY_WEB_BFF_CLIENT_ID:sharity-web-bff}
    client-secret: ${SHARITY_WEB_BFF_CLIENT_SECRET:change-me-local-only}
    redirect-uri: ${SHARITY_BFF_PUBLIC_BASE_URL:https://vinodbalakumar.com}/login/oauth2/code/sharity-web-bff
    authorization-server-public-base-url: ${AUTH_SERVER_PUBLIC_BASE_URL:https://vinodbalakumar.com/authorization-server/api}
    authorization-server-base-url: ${AUTH_SERVER_BASE_URL:http://localhost:8083/authorization-server/api}
  backends:
    authorization-server: ${AUTHORIZATION_SERVER_BACKEND_URL:http://authorization-server:8080/authorization-server}
    marketplace-service: ${MARKETPLACE_SERVICE_BACKEND_URL:http://marketplace-service:8080/marketplace-service}
    payment-service: ${PAYMENT_SERVICE_BACKEND_URL:http://payment-service:8080/payment-service}
    wallet-service: ${WALLET_SERVICE_BACKEND_URL:http://wallet-service:8080/wallet-service}
  web:
    redirect-uri: ${SHARITY_WEB_BASE_URL:https://vinodbalakumar.com/app/}

management:
  endpoints:
    web:
      exposure:
        include: health
