# -----------------------------------------------------------------------------
# Platform Web BFF - local developer profile
#
# Local development uses PostgreSQL and localhost URLs that match the workspace
# service port convention.
# -----------------------------------------------------------------------------

server.port=9090
server.forward-headers-strategy=framework
server.servlet.session.cookie.name=SHARITY_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=Lax
server.servlet.session.cookie.path=/

spring.datasource.url=jdbc:postgresql://localhost:5432/platform_web_bff
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.flyway.locations=classpath:db/migration-postgresql

spring.security.oauth2.client.registration.sharity-web-bff.redirect-uri=http://localhost:9090/login/oauth2/code/sharity-web-bff
spring.security.oauth2.client.provider.sharity-web-bff.authorization-uri=http://localhost:9093/authorization-server/api/oauth2/authorize
spring.security.oauth2.client.provider.sharity-web-bff.token-uri=http://localhost:9093/authorization-server/api/oauth2/token
spring.security.oauth2.client.provider.sharity-web-bff.user-info-uri=http://localhost:9093/authorization-server/api/userinfo
spring.security.oauth2.client.provider.sharity-web-bff.jwk-set-uri=http://localhost:9093/authorization-server/api/oauth2/jwks

app.security.allowed-origin=http://localhost:8082
app.security.allowed-origins=http://localhost:8082,http://192.168.0.200:8082,http://localhost:19006,http://localhost:9173,http://localhost:9174
app.oauth2.redirect-uri=http://localhost:9090/login/oauth2/code/sharity-web-bff
app.oauth2.authorization-server-public-base-url=http://localhost:9093/authorization-server/api
app.oauth2.authorization-server-base-url=http://localhost:9093/authorization-server/api
app.backends.authorization-server=http://localhost:9093/authorization-server
app.backends.marketplace-service=http://localhost:9094/marketplace-service
app.backends.payment-service=http://localhost:9095/payment-service
app.backends.wallet-service=http://localhost:9096/wallet-service
app.web.redirect-uri=http://192.168.0.200:8082/app/
