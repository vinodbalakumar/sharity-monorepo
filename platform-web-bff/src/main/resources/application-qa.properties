# -----------------------------------------------------------------------------
# Platform Web BFF - QA profile
#
# QA uses MySQL and routes browser-facing/cross-service URLs through the public
# QA domain instead of localhost.
# -----------------------------------------------------------------------------

server.port=8080
server.forward-headers-strategy=framework
server.servlet.session.cookie.name=SHARITY_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=Lax
server.servlet.session.cookie.path=/

spring.datasource.url=jdbc:mysql://localhost:3306/platform_web_bff?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.flyway.locations=classpath:db/migration

spring.security.oauth2.client.registration.sharity-web-bff.redirect-uri=https://vinodbalakumar.com/login/oauth2/code/sharity-web-bff
spring.security.oauth2.client.provider.sharity-web-bff.authorization-uri=https://vinodbalakumar.com/authorization-server/api/oauth2/authorize
spring.security.oauth2.client.provider.sharity-web-bff.token-uri=https://vinodbalakumar.com/authorization-server/api/oauth2/token
spring.security.oauth2.client.provider.sharity-web-bff.user-info-uri=https://vinodbalakumar.com/authorization-server/api/userinfo
spring.security.oauth2.client.provider.sharity-web-bff.jwk-set-uri=https://vinodbalakumar.com/authorization-server/api/oauth2/jwks

app.security.allowed-origin=https://vinodbalakumar.com
app.oauth2.redirect-uri=https://vinodbalakumar.com/login/oauth2/code/sharity-web-bff
app.oauth2.authorization-server-public-base-url=https://vinodbalakumar.com/authorization-server/api
app.oauth2.authorization-server-base-url=https://vinodbalakumar.com/authorization-server/api
app.backends.authorization-server=http://authorization-server:8080/authorization-server
app.backends.marketplace-service=http://marketplace-service:8080/marketplace-service
app.backends.payment-service=http://payment-service:8080/payment-service
app.backends.wallet-service=http://wallet-service:8080/wallet-service
app.web.redirect-uri=https://vinodbalakumar.com/app/?login=success
