# -----------------------------------------------------------------------------
# Platform Web BFF - production profile
#
# Production uses PostgreSQL and expects infrastructure to inject public URLs,
# service URLs, and credentials.
# -----------------------------------------------------------------------------

server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=framework
server.servlet.session.cookie.name=SHARITY_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${BFF_SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=Lax
server.servlet.session.cookie.path=/

spring.datasource.url=${BFF_DB_URL}
spring.datasource.username=${BFF_DB_USERNAME}
spring.datasource.password=${BFF_DB_PASSWORD}
spring.flyway.locations=classpath:db/migration-postgresql

spring.security.oauth2.client.registration.sharity-web-bff.redirect-uri=${SHARITY_BFF_PUBLIC_BASE_URL}/login/oauth2/code/sharity-web-bff
spring.security.oauth2.client.provider.sharity-web-bff.authorization-uri=${AUTH_SERVER_PUBLIC_BASE_URL}/oauth2/authorize
spring.security.oauth2.client.provider.sharity-web-bff.token-uri=${AUTH_SERVER_BASE_URL}/oauth2/token
spring.security.oauth2.client.provider.sharity-web-bff.user-info-uri=${AUTH_SERVER_BASE_URL}/userinfo
spring.security.oauth2.client.provider.sharity-web-bff.jwk-set-uri=${AUTH_SERVER_BASE_URL}/oauth2/jwks

app.security.allowed-origin=${SHARITY_WEB_ALLOWED_ORIGIN}
app.oauth2.redirect-uri=${SHARITY_BFF_PUBLIC_BASE_URL}/login/oauth2/code/sharity-web-bff
app.oauth2.authorization-server-public-base-url=${AUTH_SERVER_PUBLIC_BASE_URL}
app.oauth2.authorization-server-base-url=${AUTH_SERVER_BASE_URL}
app.backends.authorization-server=${AUTHORIZATION_SERVER_BACKEND_URL}
app.backends.marketplace-service=${MARKETPLACE_SERVICE_BACKEND_URL}
app.backends.payment-service=${PAYMENT_SERVICE_BACKEND_URL}
app.backends.wallet-service=${WALLET_SERVICE_BACKEND_URL}
app.web.redirect-uri=${SHARITY_WEB_BASE_URL}/app/
