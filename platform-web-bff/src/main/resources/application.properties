# Platform Web BFF - shared configuration.
# Local fallback values are defined in the profile-specific document below.
spring.application.name=platform-web-bff
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Spring's SPRING_DATASOURCE_* environment variables can override these properties.
spring.datasource.url=${BFF_DB_URL:${bff.local.database-url}}
spring.datasource.username=${BFF_DB_USERNAME:${bff.local.database-username}}
spring.datasource.password=${BFF_DB_PASSWORD:${bff.local.database-password}}
spring.flyway.enabled=true
spring.flyway.table=platform_web_bff_flyway_schema_history
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.open-in-view=false

server.port=${SERVER_PORT:9090}
server.forward-headers-strategy=framework
server.servlet.session.cookie.name=SHARITY_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${BFF_SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=Lax
server.servlet.session.cookie.path=/

spring.security.oauth2.client.registration.sharity-web-bff.client-id=${SHARITY_WEB_BFF_CLIENT_ID:sharity-web-bff}
spring.security.oauth2.client.registration.sharity-web-bff.client-secret=${SHARITY_WEB_BFF_CLIENT_SECRET:${bff.local.client-secret}}
spring.security.oauth2.client.registration.sharity-web-bff.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.sharity-web-bff.client-authentication-method=client_secret_basic
spring.security.oauth2.client.registration.sharity-web-bff.scope=openid,profile
spring.security.oauth2.client.registration.sharity-web-bff.redirect-uri=${SHARITY_BFF_PUBLIC_BASE_URL:http://localhost:9090}/login/oauth2/code/sharity-web-bff
spring.security.oauth2.client.provider.sharity-web-bff.authorization-uri=${AUTH_SERVER_PUBLIC_BASE_URL:http://localhost:9093/authorization-server/api}/oauth2/authorize
spring.security.oauth2.client.provider.sharity-web-bff.token-uri=${AUTH_SERVER_BASE_URL:http://localhost:9093/authorization-server/api}/oauth2/token
spring.security.oauth2.client.provider.sharity-web-bff.user-info-uri=${AUTH_SERVER_BASE_URL:http://localhost:9093/authorization-server/api}/userinfo
spring.security.oauth2.client.provider.sharity-web-bff.jwk-set-uri=${AUTH_SERVER_BASE_URL:http://localhost:9093/authorization-server/api}/oauth2/jwks
spring.security.oauth2.client.provider.sharity-web-bff.user-name-attribute=sub

app.oauth2.client-id=${spring.security.oauth2.client.registration.sharity-web-bff.client-id}
app.oauth2.client-secret=${spring.security.oauth2.client.registration.sharity-web-bff.client-secret}
app.oauth2.redirect-uri=${spring.security.oauth2.client.registration.sharity-web-bff.redirect-uri}
app.oauth2.authorization-server-public-base-url=${AUTH_SERVER_PUBLIC_BASE_URL:http://localhost:9093/authorization-server/api}
app.oauth2.authorization-server-base-url=${AUTH_SERVER_BASE_URL:http://localhost:9093/authorization-server/api}
app.backends.authorization-server=${AUTHORIZATION_SERVER_BACKEND_URL:http://localhost:9093/authorization-server}
app.backends.marketplace-service=${MARKETPLACE_SERVICE_BACKEND_URL:http://localhost:9094/marketplace-service}
app.backends.payment-service=${PAYMENT_SERVICE_BACKEND_URL:http://localhost:9095/payment-service}
app.backends.wallet-service=${WALLET_SERVICE_BACKEND_URL:http://localhost:9096/wallet-service}
app.backends.ai-service=${AI_SERVICE_BACKEND_URL:http://localhost:8086}
app.web.redirect-uri=${SHARITY_WEB_BASE_URL:http://localhost:9174/app/}
app.security.allowed-origin=${SHARITY_WEB_ALLOWED_ORIGIN:http://localhost:9174}

management.endpoints.web.exposure.include=health

# Diagnostic delivery contains metadata only.
app.diagnostics.enabled=${DIAGNOSTICS_ENABLED:false}
app.diagnostics.url=${DIAGNOSTICS_URL:http://localhost:8086/internal/diagnostics/events}
app.diagnostics.token=${DIAGNOSTICS_TOKEN:}
app.diagnostics.slow-ms=${DIAGNOSTICS_SLOW_MS:2000}
server.error.include-message=never
server.error.include-stacktrace=never

# Configure a private collector before enabling export.
management.tracing.sampling.probability=${TRACING_SAMPLE_PROBABILITY:0.1}
management.tracing.export.otlp.enabled=${OTEL_EXPORT_ENABLED:false}
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
management.otlp.metrics.export.enabled=${OTEL_EXPORT_ENABLED:false}
management.otlp.metrics.export.url=${OTEL_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
management.logging.export.otlp.enabled=${OTEL_EXPORT_ENABLED:false}
management.opentelemetry.logging.export.otlp.endpoint=${OTEL_LOGS_ENDPOINT:http://localhost:4318/v1/logs}

app.chat.bff-token=${CHAT_BFF_TOKEN:}
logging.structured.format.console=logstash
logging.level.root=INFO
logging.level.org.springframework.web=WARN
spring.http.log-request-details=false

# Local fallbacks do not exist when only QA or production is active.
#---
spring.config.activate.on-profile=local
bff.local.database-url=jdbc:postgresql://localhost:5432/sauth
bff.local.database-username=postgres
bff.local.database-password=postgres
bff.local.client-secret=change-me-local-only
spring.flyway.locations=classpath:db/migration-postgresql
app.security.allowed-origins=${SHARITY_WEB_ALLOWED_ORIGINS:http://localhost:8082,http://192.168.0.200:8082,http://localhost:19006,http://localhost:9173,http://localhost:9174}
app.jwt.issuer=${JWT_ISSUER:${app.oauth2.authorization-server-public-base-url}}
app.jwt.audience=${JWT_AUDIENCE:auth-clients}
