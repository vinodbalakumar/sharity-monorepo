# -----------------------------------------------------------------------------
# Platform Web BFF - shared defaults
#
# Keep this file focused on values that are stable in every environment.
# Hostnames, database vendor, and cookie security live in profile-specific files.
# -----------------------------------------------------------------------------

spring.application.name=platform-web-bff
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
spring.datasource.url=${BFF_DB_URL}
spring.datasource.username=${BFF_DB_USERNAME}
spring.datasource.password=${BFF_DB_PASSWORD}

spring.flyway.enabled=true
spring.flyway.table=platform_web_bff_flyway_schema_history
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.open-in-view=false

spring.security.oauth2.client.registration.sharity-web-bff.client-id=${SHARITY_WEB_BFF_CLIENT_ID:sharity-web-bff}
spring.security.oauth2.client.registration.sharity-web-bff.client-secret=${SHARITY_WEB_BFF_CLIENT_SECRET}
spring.security.oauth2.client.registration.sharity-web-bff.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.sharity-web-bff.client-authentication-method=client_secret_basic
spring.security.oauth2.client.registration.sharity-web-bff.scope=openid,profile
spring.security.oauth2.client.provider.sharity-web-bff.user-name-attribute=sub

app.oauth2.client-id=${SHARITY_WEB_BFF_CLIENT_ID:sharity-web-bff}
app.oauth2.client-secret=${SHARITY_WEB_BFF_CLIENT_SECRET}

management.endpoints.web.exposure.include=health

# Shared diagnostic delivery: metadata only; no AI calls on customer request threads.
app.diagnostics.enabled=${DIAGNOSTICS_ENABLED:false}
app.diagnostics.url=${DIAGNOSTICS_URL:http://localhost:8086/internal/diagnostics/events}
app.diagnostics.token=${DIAGNOSTICS_TOKEN:}
server.error.include-message=never
server.error.include-stacktrace=never

# Optional trace export; configure a private collector before enabling.
management.tracing.sampling.probability=${TRACING_SAMPLE_PROBABILITY:0.1}
management.tracing.export.otlp.enabled=${OTEL_EXPORT_ENABLED:false}
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
logging.structured.format.console=logstash

management.otlp.metrics.export.enabled=${OTEL_EXPORT_ENABLED:false}
management.otlp.metrics.export.url=${OTEL_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
management.logging.export.otlp.enabled=${OTEL_EXPORT_ENABLED:false}
management.opentelemetry.logging.export.otlp.endpoint=${OTEL_LOGS_ENDPOINT:http://localhost:4318/v1/logs}

app.diagnostics.slow-ms=${DIAGNOSTICS_SLOW_MS:2000}
app.chat.bff-token=${CHAT_BFF_TOKEN:}
logging.level.root=INFO
logging.level.org.springframework.web=WARN
spring.http.log-request-details=false
