# -----------------------------------------------------------------------------
# Payment Service - local developer profile
#
# Local development uses PostgreSQL and local dependent service endpoints.
# -----------------------------------------------------------------------------

server.port=9095

spring.datasource.url=jdbc:postgresql://localhost:5432/payment_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.flyway.locations=classpath:db/migration-postgresql

app.jwt.public-key-path=c:/data/certs/jwt-public.pem
app.jwt.issuer=http://localhost:9093/authorization-server/api
app.internal.service-token=local-dev-internal-token
app.services.authorization-provider-eligibility-url=http://localhost:9093/authorization-server/api/internal/api/v1
app.services.wallet-internal-url=http://localhost:9096/wallet-service/internal/api/v1
