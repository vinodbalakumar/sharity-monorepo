# -----------------------------------------------------------------------------
# Payment Service - production profile
#
# Production uses PostgreSQL and expects infrastructure to inject all network
# endpoints and credentials.
# -----------------------------------------------------------------------------

server.port=${SERVER_PORT:8085}

spring.datasource.url=${PAYMENT_DB_URL:${DB_URL}}
spring.datasource.username=${PAYMENT_DB_USERNAME:${DB_USERNAME}}
spring.datasource.password=${PAYMENT_DB_PASSWORD:${DB_PASSWORD}}
spring.flyway.locations=classpath:db/migration-postgresql

app.jwt.public-key-path=${JWT_PUBLIC_KEY_PATH}
app.jwt.issuer=${AUTH_ISSUER_URL}
app.internal.service-token=${INTERNAL_SERVICE_TOKEN}
app.services.authorization-provider-eligibility-url=${AUTH_PROVIDER_ELIGIBILITY_INTERNAL_URL}
app.services.wallet-internal-url=${WALLET_SERVICE_INTERNAL_URL}
