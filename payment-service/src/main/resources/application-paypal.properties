# PayPal Integration Configuration
# Use this configuration to enable real PayPal integration
# Activate with: --spring.profiles.active=paypal

# Payment Gateway Selection
payment.gateway.provider=paypal-real

# PayPal API Configuration
paypal.client-id=${PAYPAL_CLIENT_ID}
paypal.client-secret=${PAYPAL_CLIENT_SECRET}
paypal.mode=SANDBOX
# For production, use: paypal.mode=LIVE

# HTTP Client Timeouts (milliseconds)
paypal.connect-timeout=10000
paypal.read-timeout=30000

# Webhook Configuration
# PayPal webhook signing key (from PayPal dashboard)
# Set via environment variable: PAYPAL_WEBHOOK_ID
