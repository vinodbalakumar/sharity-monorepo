spring:
  datasource:
    url: ${PAYMENT_DB_URL:${DB_URL:jdbc:mysql://${PAYMENT_DB_HOST:${DB_HOST:localhost}}:${PAYMENT_DB_PORT:${DB_PORT:3306}}/${PAYMENT_DB_NAME:payment_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
    username: ${PAYMENT_DB_USERNAME:${DB_USERNAME:root}}
    password: ${PAYMENT_DB_PASSWORD:${DB_PASSWORD:root}}
  flyway:
    enabled: ${PAYMENT_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
