spring:
  datasource:
    url: ${PAYMENT_DB_URL:${DB_URL:jdbc:postgresql://${PAYMENT_DB_HOST:${DB_HOST:localhost}}:${PAYMENT_DB_PORT:${DB_PORT:5432}}/${PAYMENT_DB_NAME:payment_db}}}
    username: ${PAYMENT_DB_USERNAME:${DB_USERNAME:postgres}}
    password: ${PAYMENT_DB_PASSWORD:${DB_PASSWORD:postgres}}
  flyway:
    enabled: ${PAYMENT_FLYWAY_ENABLED:true}
    locations: classpath:db/migration-postgresql
