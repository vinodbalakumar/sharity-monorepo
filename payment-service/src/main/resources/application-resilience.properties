# Resilience4j Configuration
# Activate with: --spring.profiles.active=resilience

# ==================== RETRY CONFIGURATION ====================

# PayPal Retry (5 attempts with exponential backoff)
resilience4j.retry.instances.paypal-retry.max-attempts=5
resilience4j.retry.instances.paypal-retry.wait-duration=1000
resilience4j.retry.instances.paypal-retry.enable-exponential-backoff=true
resilience4j.retry.instances.paypal-retry.exponential-backoff-multiplier=2

# Service Retry (3 attempts)
resilience4j.retry.instances.service-retry.max-attempts=3
resilience4j.retry.instances.service-retry.wait-duration=500
resilience4j.retry.instances.service-retry.enable-exponential-backoff=true
resilience4j.retry.instances.service-retry.exponential-backoff-multiplier=2

# Database Retry (3 attempts, quick)
resilience4j.retry.instances.database-retry.max-attempts=3
resilience4j.retry.instances.database-retry.wait-duration=100
resilience4j.retry.instances.database-retry.enable-exponential-backoff=false

# ==================== CIRCUIT BREAKER CONFIGURATION ====================

# PayPal Circuit Breaker
# Opens if 50% of last 100 calls fail
resilience4j.circuitbreaker.instances.paypal-circuit-breaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.paypal-circuit-breaker.wait-duration-in-open-state=30000
resilience4j.circuitbreaker.instances.paypal-circuit-breaker.permitted-number-of-calls-in-half-open-state=5
resilience4j.circuitbreaker.instances.paypal-circuit-breaker.sliding-window-size=100
resilience4j.circuitbreaker.instances.paypal-circuit-breaker.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.paypal-circuit-breaker.automatic-transition-from-open-to-half-open-enabled=true

# Marketplace Circuit Breaker
# Opens if 60% of last 50 calls fail
resilience4j.circuitbreaker.instances.marketplace-circuit-breaker.failure-rate-threshold=60
resilience4j.circuitbreaker.instances.marketplace-circuit-breaker.wait-duration-in-open-state=20000
resilience4j.circuitbreaker.instances.marketplace-circuit-breaker.permitted-number-of-calls-in-half-open-state=5
resilience4j.circuitbreaker.instances.marketplace-circuit-breaker.sliding-window-size=50
resilience4j.circuitbreaker.instances.marketplace-circuit-breaker.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.marketplace-circuit-breaker.automatic-transition-from-open-to-half-open-enabled=true

# Authorization Circuit Breaker
# Opens if 40% of last 30 calls fail
resilience4j.circuitbreaker.instances.authorization-circuit-breaker.failure-rate-threshold=40
resilience4j.circuitbreaker.instances.authorization-circuit-breaker.wait-duration-in-open-state=15000
resilience4j.circuitbreaker.instances.authorization-circuit-breaker.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.authorization-circuit-breaker.sliding-window-size=30
resilience4j.circuitbreaker.instances.authorization-circuit-breaker.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.authorization-circuit-breaker.automatic-transition-from-open-to-half-open-enabled=true

# ==================== TIMEOUT CONFIGURATION ====================

# PayPal timeouts
paypal.connect-timeout=10000
paypal.read-timeout=30000

# Service timeouts
service.connect-timeout=5000
service.read-timeout=10000

# Database timeouts
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.jdbc.fetch_size=50
