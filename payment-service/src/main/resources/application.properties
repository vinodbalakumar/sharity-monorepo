# -----------------------------------------------------------------------------
# Payment Service - shared defaults
#
# Stable service behavior lives here. Profile-specific files own database vendor,
# ports, hostnames, and environment-specific secrets.
# -----------------------------------------------------------------------------

server.forward-headers-strategy=framework
server.servlet.context-path=/payment-service

spring.application.name=payment-service
spring.profiles.active=${SPRING_PROFILES_ACTIVE:qa}
spring.datasource.url=${PAYMENT_DB_URL}
spring.datasource.username=${PAYMENT_DB_USERNAME}
spring.datasource.password=${PAYMENT_DB_PASSWORD}
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.jpa.hibernate.ddl-auto=${PAYMENT_JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false

app.jwt.audience=${JWT_AUDIENCE:PAYMENT_API}
app.payment.gateway-mode=${PAYMENT_GATEWAY_MODE:mock}
app.payment.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.payment.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
