# -----------------------------------------------------------------------------
# Payment Service - shared defaults
#
# Stable service behavior lives here. Profile-specific files own database vendor,
# ports, hostnames, and environment-specific secrets.
# -----------------------------------------------------------------------------

server.forward-headers-strategy=framework
server.port=${SERVER_PORT:${payment.local.server-port:8080}}
server.servlet.context-path=/payment-service

spring.application.name=payment-service
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
spring.datasource.url=${PAYMENT_DB_URL:${payment.local.database-url}}
spring.datasource.username=${PAYMENT_DB_USERNAME:${payment.local.database-username}}
spring.datasource.password=${PAYMENT_DB_PASSWORD:postgres}
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.jpa.hibernate.ddl-auto=${PAYMENT_JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false

app.jwt.audience=${JWT_AUDIENCE:PAYMENT_API}
app.jwt.public-key-base64=${APP_JWT_PUBLIC_KEY_BASE64:}
app.payment.gateway-mode=${PAYMENT_GATEWAY_MODE:mock}
app.payment.demo-transactions-enabled=${COMMERCE_DEMO_PURCHASES_ENABLED:${payment.local.demo-transactions-enabled:false}}
app.payment.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.payment.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Shared diagnostic delivery: metadata only; no AI calls on customer request threads.
app.diagnostics.enabled=${DIAGNOSTICS_ENABLED:false}
app.diagnostics.url=${DIAGNOSTICS_URL:http://localhost:8086/internal/diagnostics/events}
app.diagnostics.token=${DIAGNOSTICS_TOKEN:}
server.error.include-message=never
server.error.include-stacktrace=never

# Optional trace export; configure a private collector before enabling.
management.tracing.sampling.probability=${TRACING_SAMPLE_PROBABILITY:0.1}
management.tracing.export.otlp.enabled=${OTEL_EXPORT_ENABLED:false}
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
logging.structured.format.console=logstash

management.otlp.metrics.export.enabled=${OTEL_EXPORT_ENABLED:false}
management.otlp.metrics.export.url=${OTEL_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
management.logging.export.otlp.enabled=${OTEL_EXPORT_ENABLED:false}
management.opentelemetry.logging.export.otlp.endpoint=${OTEL_LOGS_ENDPOINT:http://localhost:4318/v1/logs}

app.diagnostics.slow-ms=${DIAGNOSTICS_SLOW_MS:2000}

# Local fallbacks do not apply to QA or production.

#---
spring.config.activate.on-profile=local
spring.config.import=optional:file:${user.home}/.sharity/local-internal-service.properties
payment.local.server-port=9095
payment.local.demo-transactions-enabled=true
payment.local.database-url=jdbc:postgresql://localhost:5432/test3
payment.local.database-username=postgres
spring.flyway.locations=classpath:db/migration-postgresql
app.jwt.public-key-path=${JWT_PUBLIC_KEY_PATH:}
app.jwt.issuer=${AUTH_ISSUER_URL:http://localhost:9093/authorization-server/api}
app.internal.service-token=${APP_INTERNAL_SERVICE_TOKEN:}
app.services.authorization-provider-eligibility-url=${AUTH_PROVIDER_ELIGIBILITY_INTERNAL_URL:http://localhost:9093/authorization-server/api/internal/api/v1}
app.services.wallet-internal-url=${WALLET_SERVICE_INTERNAL_URL:http://localhost:9096/wallet-service/internal/api/v1}
