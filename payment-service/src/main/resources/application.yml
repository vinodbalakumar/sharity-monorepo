server:
  port: ${SERVER_PORT:8085}
  forward-headers-strategy: framework
  servlet:
    context-path: /payment-service

spring:
  application:
    name: payment-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local,mysql}
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: ${PAYMENT_JPA_DDL_AUTO:validate}
    open-in-view: false

app:
  jwt:
    public-key-path: ${JWT_PUBLIC_KEY_PATH:c:/data/certs/jwt-public.pem}
    issuer: ${AUTH_ISSUER_URL:http://localhost:8083/authorization-server/api}
    audience: ${JWT_AUDIENCE:PAYMENT_API}
  internal:
    service-token: ${INTERNAL_SERVICE_TOKEN:local-dev-internal-token}
  payment:
    gateway-mode: ${PAYMENT_GATEWAY_MODE:mock}
    stripe:
      secret-key: ${STRIPE_SECRET_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  services:
    authorization-provider-eligibility-url: ${AUTH_PROVIDER_ELIGIBILITY_INTERNAL_URL:http://localhost:8083/authorization-server/api/internal/api/v1}
    wallet-internal-url: ${WALLET_SERVICE_INTERNAL_URL:http://localhost:8086/wallet-service/internal/api/v1}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

