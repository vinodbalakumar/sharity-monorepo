# Email Configuration (activate with spring.profiles.active=mail)

# Enable mail sending
mail.enabled=true
mail.from=notifications@sharity.com

# SMTP Configuration (Gmail example)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Alternative: AWS SES
# spring.mail.host=email-smtp.${AWS_REGION}.amazonaws.com
# spring.mail.port=587
# spring.mail.username=${AWS_SES_USERNAME}
# spring.mail.password=${AWS_SES_PASSWORD}

# Email thread pool (async notifications)
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=20
spring.task.execution.pool.queue-capacity=500
