# -----------------------------------------------------------------------------
# Wallet Service - local developer profile
#
# Local development uses MySQL and the shared local authorization server.
# -----------------------------------------------------------------------------

server.port=9096

spring.flyway.locations=classpath:db/migration

app.jwt.public-key-path=${user.home}/projects/certs/jwt-public.pem
app.jwt.issuer=http://localhost:9093/authorization-server/api
app.internal.service-token=local-dev-internal-token

# Runtime credentials are kept outside the service repositories.
spring.config.import=file:${BACKEND_LOCAL_CONFIG:${user.home}/projects/deployments/.env.backend-local.properties}
