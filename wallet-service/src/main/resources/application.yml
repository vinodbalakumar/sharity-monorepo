server:
  port: ${SERVER_PORT:8086}
  forward-headers-strategy: framework
  servlet:
    context-path: /wallet-service

spring:
  application:
    name: wallet-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local,mysql}
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: ${WALLET_JPA_DDL_AUTO:validate}
    open-in-view: false

app:
  jwt:
    public-key-path: ${JWT_PUBLIC_KEY_PATH:c:/data/certs/jwt-public.pem}
    issuer: ${AUTH_ISSUER_URL:http://localhost:8083/authorization-server/api}
    audience: ${JWT_AUDIENCE:WALLET_API}
  internal:
    service-token: ${INTERNAL_SERVICE_TOKEN:local-dev-internal-token}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

