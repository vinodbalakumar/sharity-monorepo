server:
  port: ${SERVER_PORT:8086}
  forward-headers-strategy: framework
  servlet:
    context-path: /wallet-service

spring:
  application:
    name: wallet-service
  datasource:
    url: jdbc:mysql://${WALLET_DB_HOST:${DB_HOST:localhost}}:${WALLET_DB_PORT:${DB_PORT:3306}}/${WALLET_DB_NAME:wallet_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${WALLET_DB_USERNAME:${DB_USERNAME:root}}
    password: ${WALLET_DB_PASSWORD:${DB_PASSWORD:root}}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

app:
  jwt:
    public-key-path: ${JWT_PUBLIC_KEY_PATH:}
    issuer: ${AUTH_ISSUER_URL:authorization-server}
    audience: ${JWT_AUDIENCE:WALLET_API}
  internal:
    service-token: ${INTERNAL_SERVICE_TOKEN:local-dev-internal-token}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
