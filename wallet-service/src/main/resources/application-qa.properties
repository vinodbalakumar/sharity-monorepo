# -----------------------------------------------------------------------------
# Wallet Service - QA profile
#
# QA uses MySQL and validates tokens against the public QA authorization issuer.
# -----------------------------------------------------------------------------

server.port=8086

spring.flyway.locations=classpath:db/migration

app.jwt.public-key-path=/keys/jwt-public.pem
app.jwt.issuer=https://vinodbalakumar.com/authorization-server/api
app.internal.service-token=local-dev-internal-token
