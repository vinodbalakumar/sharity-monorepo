# -----------------------------------------------------------------------------
# Wallet Service - production profile
#
# Production uses PostgreSQL and expects infrastructure to provide credentials,
# trust material, and service tokens.
# -----------------------------------------------------------------------------

server.port=${SERVER_PORT:8086}

spring.datasource.url=${WALLET_DB_URL:${DB_URL}}
spring.datasource.username=${WALLET_DB_USERNAME:${DB_USERNAME}}
spring.datasource.password=${WALLET_DB_PASSWORD:${DB_PASSWORD}}
spring.flyway.locations=classpath:db/migration-postgresql

app.jwt.public-key-path=${JWT_PUBLIC_KEY_PATH}
app.jwt.issuer=${AUTH_ISSUER_URL}
app.internal.service-token=${INTERNAL_SERVICE_TOKEN}
