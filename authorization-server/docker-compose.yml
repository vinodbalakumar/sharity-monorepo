services:
  mysql:
    image: mysql:8.4
    container_name: authorization-server-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: auth
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - authorization_server_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  authorization_server_mysql_data:
