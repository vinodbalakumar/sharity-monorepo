# Authorization Server - QA environment defaults
# Use these settings when deploying to the QA environment.

# Database: PostgreSQL on QA database host
spring.datasource.url=jdbc:postgresql://${DB_HOST:auth-qa-db}:5432/sharity_auth_qa
spring.datasource.username=${DB_USER:sharity_user}
spring.datasource.password=${DB_PASSWORD:?MUST_BE_SET_VIA_ENV}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=900000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate ORM
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQL92Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=32
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Mail via QA SMTP relay
spring.mail.host=${MAIL_HOST:smtp.qa.internal}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:qa-bot@sharity.internal}
spring.mail.password=${MAIL_PASSWORD:?MUST_BE_SET_VIA_ENV}
spring.mail.properties.mail.smtp.starttls.required=true

# OAuth2 UI and frontend deep links: point to QA environment
app.social.frontend-login-success-url=https://qa.sharity.com/app/
app.social.frontend-register-url=https://qa.sharity.com/app/register

# Server identity and isolation
server.servlet.context-path=/authorization-server
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=true

# CORS: allow QA frontends
app.cors.allowed-origins=https://qa.sharity.com,https://qa-web.sharity.com,https://qa-mobile.sharity.com

# Cookie security: strict for QA environment
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.domain=qa.sharity.com

# Asset storage: use mounted volume or network share
app.profile-image-storage.local-directory=/var/lib/sharity/profile-images

# Logging
logging.level.root=INFO
logging.level.com.java.vinod=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
