# Authorization Server - Local development defaults
# Use these settings when running the service locally on your machine.

# Database: PostgreSQL on localhost
spring.datasource.url=jdbc:postgresql://localhost:5432/sharity_auth_local
spring.datasource.username=sharity_user
spring.datasource.password=REDACTED_LEGACY_CREDENTIAL
spring.datasource.hikari.maximum-pool-size=5

# JPA / Hibernate ORM
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQL92Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=16
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Mail via local sink (e.g., maildev, not an actual SMTP host)
spring.mail.host=localhost
spring.mail.port=1025

# OAuth2 UI and frontend deep links: point to localhost where your frontend dev server runs
app.social.frontend-login-success-url=http://localhost:3000/app/
app.social.frontend-register-url=http://localhost:3000/app/register

# Server identity and isolation
server.servlet.context-path=/authorization-server
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# CORS: allow localhost frontends
app.cors.allowed-origins=http://localhost:3000,http://localhost:3001,http://localhost:8081

# Cookie security: safe defaults for local development
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.domain=localhost

# Asset storage: use temp directory
app.profile-image-storage.local-directory=/tmp/sharity-profile-images

# Logging
logging.level.root=INFO
logging.level.com.java.vinod=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
