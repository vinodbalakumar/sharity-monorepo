# -----------------------------------------------------------------------------
# Authorization Server - shared defaults
#
# Keep this file intentionally simple.
# Only place settings here when every environment should behave the same way.
# Environment-specific values such as database vendor, hostnames, and secure
# cookie rules live in application-local.properties, application-qa.properties,
# and application-prod.properties.
# -----------------------------------------------------------------------------

# Service identity
spring.application.name=authorization-server

# Default startup profile.
# Local is the safest default for a developer machine.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
spring.datasource.url=${AUTH_DB_URL:jdbc:postgresql://localhost:5432/sauth}
spring.datasource.username=${AUTH_DB_USERNAME:postgres}
spring.datasource.password=${AUTH_DB_PASSWORD:postgres}
server.port=${SERVER_PORT:9093}
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH:/authorization-server/api}

# JWT key material remains external; only local issuer/audience defaults are provided.
app.jwt.private-key-base64=${APP_JWT_PRIVATE_KEY_BASE64:}
app.jwt.private-key-path=${APP_JWT_PRIVATE_KEY_PATH:}
app.jwt.public-key-base64=${APP_JWT_PUBLIC_KEY_BASE64:}
app.jwt.public-key-path=${APP_JWT_PUBLIC_KEY_PATH:}
app.jwt.issuer=${APP_JWT_ISSUER:http://localhost:9093/authorization-server/api}
app.jwt.audience=${APP_JWT_AUDIENCE:auth-clients}
app.jwt.audiences=${APP_JWT_AUDIENCES:auth-clients,MARKETPLACE_API,PAYMENT_API,WALLET_API}

# Local-only integration defaults; deployments can override each value.
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:25}
app.oauth2.web-bff.redirect-uri=${SHARITY_BFF_REDIRECT_URI:http://localhost:9090/login/oauth2/code/sharity-web-bff}
app.internal.service-token=${APP_INTERNAL_SERVICE_TOKEN:}
app.email.from=${APP_EMAIL_FROM:no-reply@localhost}
app.email.from-name=${APP_EMAIL_FROM_NAME:Sharity Local}
app.email.frontend-base-url=${APP_EMAIL_FRONTEND_BASE_URL:http://localhost:9174/app}
app.email.delivery-enabled=${APP_EMAIL_DELIVERY_ENABLED:false}

# Common mail transport behavior.
# Hostnames and credentials still belong in the environment-specific files.
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_READ_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT_MS:5000}

# Flyway and JPA rules that should stay identical across environments.
spring.flyway.enabled=true
spring.flyway.out-of-order=true
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# OAuth/OIDC client registrations are part of the product contract, not an
# environment-only concern. Secrets still come from environment variables.
app.oauth2.web-bff.client-id=${SHARITY_WEB_BFF_CLIENT_ID:sharity-web-bff}
app.oauth2.web-bff.client-secret=${SHARITY_WEB_BFF_CLIENT_SECRET:change-me-local-only}
app.oauth2.native-clients.android.client-id=${SHARITY_ANDROID_CLIENT_ID:sharity-android}
app.oauth2.native-clients.ios.client-id=${SHARITY_IOS_CLIENT_ID:sharity-ios}
app.oauth2.native-clients.windows.client-id=${SHARITY_WINDOWS_CLIENT_ID:sharity-desktop-windows}
app.oauth2.native-clients.macos.client-id=${SHARITY_MACOS_CLIENT_ID:sharity-desktop-macos}

# Token lifetimes stay aligned in every environment.
app.jwt.access-token-expiration=PT15M
app.refresh-token.expiration=P7D

# These paths are part of user flows and remain consistent between environments.
app.email.verification-path=${EMAIL_VERIFICATION_PATH:/verify-email}
app.email.password-reset-path=${PASSWORD_RESET_PATH:/reset-password}

# Asset upload constraints should not change per environment unless operations
# explicitly overrides them through environment variables.
spring.servlet.multipart.max-file-size=${ASSET_UPLOAD_MAX_FILE_SIZE_BYTES:5242880}
spring.servlet.multipart.max-request-size=${ASSET_UPLOAD_MAX_FILE_SIZE_BYTES:5242880}
app.profile-image-storage.max-file-size-bytes=${ASSET_UPLOAD_MAX_FILE_SIZE_BYTES:5242880}

# Registration cleanup is operationally safe to keep enabled everywhere.
app.registration-cleanup.enabled=${REGISTRATION_CLEANUP_ENABLED:true}
app.registration-cleanup.pending-retention=${REGISTRATION_PENDING_RETENTION:P1D}
app.registration-cleanup.initial-delay-ms=${REGISTRATION_CLEANUP_INITIAL_DELAY_MS:300000}
app.registration-cleanup.fixed-delay-ms=${REGISTRATION_CLEANUP_FIXED_DELAY_MS:3600000}

# Shared API documentation paths.
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Shared health endpoint behavior.
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=${MAIL_HEALTH_ENABLED:false}

# Shared diagnostic delivery: metadata only; no AI calls on customer request threads.
app.diagnostics.enabled=${DIAGNOSTICS_ENABLED:false}
app.diagnostics.url=${DIAGNOSTICS_URL:http://localhost:8086/internal/diagnostics/events}
app.diagnostics.token=${DIAGNOSTICS_TOKEN:}
server.error.include-message=never
server.error.include-stacktrace=never

# Optional trace export; configure a private collector before enabling.
management.tracing.sampling.probability=${TRACING_SAMPLE_PROBABILITY:0.1}
management.tracing.export.otlp.enabled=${OTEL_EXPORT_ENABLED:false}
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
logging.structured.format.console=logstash

management.otlp.metrics.export.enabled=${OTEL_EXPORT_ENABLED:false}
management.otlp.metrics.export.url=${OTEL_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
management.logging.export.otlp.enabled=${OTEL_EXPORT_ENABLED:false}
management.opentelemetry.logging.export.otlp.endpoint=${OTEL_LOGS_ENDPOINT:http://localhost:4318/v1/logs}

app.diagnostics.slow-ms=${DIAGNOSTICS_SLOW_MS:2000}

app.web.allowed-origin=${SHARITY_WEB_ALLOWED_ORIGIN:}

#---
spring.config.activate.on-profile=local
spring.config.import=optional:file:${user.home}/.sharity/local-internal-service.properties
app.web.allowed-origin=${SHARITY_WEB_ALLOWED_ORIGIN:http://localhost:9173,http://localhost:9174}
