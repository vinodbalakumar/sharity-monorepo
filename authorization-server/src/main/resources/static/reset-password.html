<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset Password</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Arial, Helvetica, sans-serif;
            background: #f6f7f9;
            color: #18202a;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
        }

        main {
            width: min(92vw, 440px);
            background: #ffffff;
            border: 1px solid #d9dee7;
            border-radius: 8px;
            padding: 28px;
            box-shadow: 0 12px 34px rgba(24, 32, 42, 0.08);
        }

        h1 {
            margin: 0 0 18px;
            font-size: 24px;
            line-height: 1.2;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 700;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            height: 42px;
            border: 1px solid #b9c2cf;
            border-radius: 6px;
            padding: 0 12px;
            font-size: 15px;
        }

        button {
            width: 100%;
            height: 42px;
            margin-top: 16px;
            border: 0;
            border-radius: 6px;
            background: #175cd3;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        button:disabled {
            background: #8aa8df;
            cursor: default;
        }

        p {
            margin: 14px 0 0;
            color: #526070;
            line-height: 1.5;
        }

        .success {
            color: #137a3d;
        }

        .error {
            color: #bd2727;
        }
    </style>
</head>
<body>
<main>
    <h1>Reset password</h1>
    <form id="form">
        <label for="password">New password</label>
        <input id="password" type="password" autocomplete="new-password" required minlength="8">
        <button id="submit" type="submit">Reset password</button>
    </form>
    <p id="message"></p>
</main>

<script>
    const form = document.getElementById("form");
    const password = document.getElementById("password");
    const submit = document.getElementById("submit");
    const message = document.getElementById("message");
    const token = new URLSearchParams(window.location.search).get("token");

    function show(state, text) {
        message.className = state;
        message.textContent = text;
    }

    if (!token) {
        submit.disabled = true;
        show("error", "This password reset link is invalid.");
    }

    form.addEventListener("submit", async (event) => {
        event.preventDefault();
        submit.disabled = true;
        show("", "Resetting password...");

        try {
            const response = await fetch("v1/auth/reset-password", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({token, newPassword: password.value})
            });

            if (response.ok) {
                form.reset();
                show("success", "Password reset complete. You can now sign in.");
                return;
            }

            const body = await response.json().catch(() => ({}));
            show("error", body.detail || "Password reset failed.");
            submit.disabled = false;
        } catch (error) {
            show("error", "Unable to reach the server. Please try again.");
            submit.disabled = false;
        }
    });
</script>
</body>
</html>
