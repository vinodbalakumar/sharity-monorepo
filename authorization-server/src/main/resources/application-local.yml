spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:auth}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    show-sql: true

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

app:
  tokens:
    expose-dev-tokens: true
  email:
    delivery-enabled: ${EMAIL_DELIVERY_ENABLED:true}
  jwt:
    private-key-path: c:/Users/HP/projects/certs/jwt-private.pem
    public-key-path: c:/Users/HP/projects/certs/jwt-public.pem
