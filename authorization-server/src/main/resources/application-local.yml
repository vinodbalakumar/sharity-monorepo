spring:
  jpa:
    show-sql: true

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

app:
  tokens:
    expose-dev-tokens: true
  email:
    delivery-enabled: ${EMAIL_DELIVERY_ENABLED:false}
  jwt:
    private-key-path: c:/data/certs/jwt-private.pem
    public-key-path: c:/data/certs/jwt-public.pem
