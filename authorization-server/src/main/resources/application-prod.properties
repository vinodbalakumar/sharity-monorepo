# Authorization Server - Production environment defaults
# Use these settings when deploying to the production environment.
# Requires strict environment-variable configuration; no secrets hardcoded.

# Database: PostgreSQL on production database host
spring.datasource.url=jdbc:postgresql://${DB_HOST:?MUST_BE_SET_VIA_ENV}:5432/${DB_NAME:sharity_auth_prod}
spring.datasource.username=${DB_USER:?MUST_BE_SET_VIA_ENV}
spring.datasource.password=${DB_PASSWORD:?MUST_BE_SET_VIA_ENV}
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate ORM
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQL92Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=64
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Mail via production SMTP relay with full TLS
spring.mail.host=${MAIL_HOST:?MUST_BE_SET_VIA_ENV}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:?MUST_BE_SET_VIA_ENV}
spring.mail.password=${MAIL_PASSWORD:?MUST_BE_SET_VIA_ENV}
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.starttls.protocols=TLSv1.2

# OAuth2 UI and frontend deep links: point to production domain
app.social.frontend-login-success-url=https://sharity.com/app/
app.social.frontend-register-url=https://sharity.com/app/register

# Server identity and isolation
server.servlet.context-path=/authorization-server
server.port=8080
server.error.include-message=never
server.error.include-binding-errors=false

# CORS: production frontends only
app.cors.allowed-origins=https://sharity.com,https://app.sharity.com,https://mobile.sharity.com

# Cookie security: maximum strictness for production
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.domain=sharity.com

# Asset storage: use R2 with local fallback
app.profile-image-storage.local-directory=/var/lib/sharity/profile-images

# Logging: production-level detail
logging.level.root=WARN
logging.level.com.java.vinod=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
