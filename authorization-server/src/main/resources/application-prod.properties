# -----------------------------------------------------------------------------
# Authorization Server - production profile
#
# Why this file exists:
# - production must be explicit about secure cookies and externalized secrets
# - production uses PostgreSQL in this workspace model
# - values should come from environment variables or deployment secrets
# -----------------------------------------------------------------------------

server.port=${SERVER_PORT:8083}
server.forward-headers-strategy=framework
server.servlet.context-path=/authorization-server/api
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${AUTH_SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=Lax

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.flyway.locations=classpath:db/migration-postgresql

spring.jpa.show-sql=${JPA_SHOW_SQL:false}
logging.level.org.springframework.web=info
logging.level.org.springframework.security=info
logging.level.org.hibernate.SQL=warn
logging.level.org.hibernate.orm.jdbc.bind=warn

app.internal.service-token=${INTERNAL_SERVICE_TOKEN}

app.oauth2.web-bff.redirect-uri=${SHARITY_BFF_PUBLIC_BASE_URL}/login/oauth2/code/sharity-web-bff
app.oauth2.native-clients.android.redirect-uri=${SHARITY_ANDROID_REDIRECT_URI}
app.oauth2.native-clients.ios.redirect-uri=${SHARITY_IOS_REDIRECT_URI}
app.oauth2.native-clients.windows.redirect-uri=${SHARITY_WINDOWS_REDIRECT_URI}
app.oauth2.native-clients.macos.redirect-uri=${SHARITY_MACOS_REDIRECT_URI}

app.jwt.private-key-base64=${JWT_PRIVATE_KEY_BASE64:}
app.jwt.public-key-base64=${JWT_PUBLIC_KEY_BASE64:}
app.jwt.private-key-path=${JWT_PRIVATE_KEY_PATH:}
app.jwt.public-key-path=${JWT_PUBLIC_KEY_PATH:}
app.jwt.issuer=${JWT_ISSUER}
app.jwt.audience=${JWT_AUDIENCE:auth-clients}
app.jwt.audiences=${JWT_AUDIENCES:auth-clients,MARKETPLACE_API,PAYMENT_API,WALLET_API}

app.email.delivery-enabled=${EMAIL_DELIVERY_ENABLED:true}
app.email.max-attempts=${EMAIL_MAX_ATTEMPTS:3}
app.email.from=${MAIL_FROM}
app.email.from-name=${MAIL_FROM_NAME:Authorization Server}
app.email.frontend-base-url=${FRONTEND_BASE_URL}

app.social.frontend-register-url=${SHARITY_FRONTEND_REGISTER_URL}
app.social.frontend-complete-registration-url=${SHARITY_FRONTEND_COMPLETE_REGISTRATION_URL}
app.social.frontend-login-success-url=${SHARITY_FRONTEND_LOGIN_SUCCESS_URL}

app.web.allowed-origin=${SHARITY_WEB_ALLOWED_ORIGIN}

app.profile-image-storage.provider-code=${ASSET_STORAGE_PROVIDER_CODE:CLOUDFLARE_R2_PRIMARY}
app.profile-image-storage.bucket-name=${ASSET_STORAGE_BUCKET_NAME}
app.profile-image-storage.endpoint-url=${ASSET_STORAGE_ENDPOINT_URL}
app.profile-image-storage.public-base-url=${ASSET_STORAGE_PUBLIC_BASE_URL}
app.profile-image-storage.region=${ASSET_STORAGE_REGION:auto}
app.profile-image-storage.access-key-id=${ASSET_STORAGE_ACCESS_KEY_ID}
app.profile-image-storage.secret-access-key=${ASSET_STORAGE_SECRET_ACCESS_KEY}
