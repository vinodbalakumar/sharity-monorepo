spring.application.name=platform-ai-service
spring.sql.init.schema-locations=classpath:chat-schema.sql
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.url=${AI_DATABASE_URL:jdbc:h2:file:./data/sharity-ai;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${AI_DATABASE_USERNAME:sa}
spring.datasource.password=${AI_DATABASE_PASSWORD:}
spring.sql.init.mode=${AI_DATABASE_INIT:embedded}
spring.ai.retry.max-attempts=1
logging.level.root=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.ai=WARN
logging.level.org.springframework.jdbc=WARN
spring.http.log-request-details=false
app.chat.bff-token=${CHAT_BFF_TOKEN:}
app.chat.max-concurrent-generations=${CHAT_MAX_CONCURRENT_GENERATIONS:2}
app.chat.founder.public-email-approved=${FOUNDER_PUBLIC_EMAIL_APPROVED:false}
app.chat.founder.email=${FOUNDER_EMAIL:vinodbalakumar.p@gmail.com}
server.port=${AI_SERVICE_PORT:8086}
app.ai.enabled=${AI_ENABLED:false}
spring.ai.model.chat=${AI_CHAT_PROVIDER:none}
# Provider and deployment-specific tuning are supplied by deployments/config/ai.
# No local model endpoint, GPU override or automatic download is configured here.
spring.ai.ollama.init.pull-model-strategy=never
app.jwt.jwk-set-uri=${AI_JWK_SET_URI:http://localhost:9093/authorization-server/api/oauth2/jwks}
app.jwt.issuer=${JWT_ISSUER:http://localhost:9093/authorization-server/api}
app.jwt.audience=${JWT_AUDIENCE:auth-clients}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.error.include-message=never
server.error.include-stacktrace=never
spring.ai.chat.observations.log-prompt=false
spring.ai.chat.observations.log-completion=false

# Shared diagnostic delivery: metadata only; no AI calls on customer request threads.
app.diagnostics.ai-enabled=${DIAGNOSTICS_AI_ENABLED:false}
app.diagnostics.slow-ms=${DIAGNOSTICS_SLOW_MS:2000}
app.diagnostics.enabled=${DIAGNOSTICS_ENABLED:false}
app.diagnostics.url=${DIAGNOSTICS_URL:http://localhost:8086/internal/diagnostics/events}
app.diagnostics.token=${DIAGNOSTICS_TOKEN:}
server.error.include-message=never
server.error.include-stacktrace=never

# Optional trace export; configure a private collector before enabling.
management.tracing.sampling.probability=${TRACING_SAMPLE_PROBABILITY:0.1}
management.tracing.export.otlp.enabled=${OTEL_EXPORT_ENABLED:false}
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
logging.structured.format.console=logstash

management.otlp.metrics.export.enabled=${OTEL_EXPORT_ENABLED:false}
management.otlp.metrics.export.url=${OTEL_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
management.logging.export.otlp.enabled=${OTEL_EXPORT_ENABLED:false}
management.opentelemetry.logging.export.otlp.endpoint=${OTEL_LOGS_ENDPOINT:http://localhost:4318/v1/logs}
