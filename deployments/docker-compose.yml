services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      sharity-admin-portal:
        condition: service_started
      sharity-app:
        condition: service_started
      authorization-server:
        condition: service_started
      platform-web-bff:
        condition: service_started
      marketplace-service:
        condition: service_started
      payment-service:
        condition: service_started
      wallet-service:
        condition: service_started
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 256m

  sharity-admin-portal:
    build:
      context: ../sharity-admin-portal
      dockerfile: ../deployments/dockerfiles/sharity-admin-portal.Dockerfile
      args:
        SHARITY_VITE_API_BASE_URL: ""
        SHARITY_VITE_TESLA_APP_URL: /tesla/
        SHARITY_VITE_COMPANY_NAME: ${SHARITY_COMPANY_NAME:-Sharity}
        SHARITY_VITE_COMPANY_TAGLINE: ${SHARITY_COMPANY_TAGLINE:-Smart business. shared rewards}
    image: sharity-admin-portal:latest
    expose:
      - "8080"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 256m

  sharity-app:
    build:
      context: ../sharity-app-ui
      dockerfile: ../deployments/dockerfiles/sharity-app.Dockerfile
      args:
        EXPO_PUBLIC_BFF_BASE_URL: ${EXPO_PUBLIC_BFF_BASE_URL:-https://vinodbalakumar.com/bff}
        EXPO_PUBLIC_SITE_BASE_URL: ${SHARITY_BFF_PUBLIC_BASE_URL:-https://vinodbalakumar.com}
        EXPO_PUBLIC_MARKETPLACE_BASE_URL: /marketplace-service/api/v1/marketplace
        EXPO_PUBLIC_ASSET_PUBLIC_BASE_URL: ${ASSET_STORAGE_PUBLIC_BASE_URL:-https://pub-c431ffbb16cd4884aa6a22a5f177f00b.r2.dev}
    image: sharity-app:latest
    expose:
      - "80"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 256m

  tesla-dashboard-ui:
    profiles:
      - disabled-tesla
    build:
      context: ../../webapps/tesla-dashboard-react
      dockerfile: ../../springbootrestdemo/deployments/dockerfiles/tesla-dashboard-ui.Dockerfile
      args:
        TESLA_VITE_API_BASE_URL: ""
    image: tesla-dashboard-ui:latest
    expose:
      - "8080"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 256m

  authorization-server:
    build:
      context: ../authorization-server
      dockerfile: ../deployments/dockerfiles/authorization-server.Dockerfile
    image: authorization-server:latest
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: qa
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:${PC_MYSQL_PORT:-3306}/${AUTH_DB_NAME:-auth}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${PC_MYSQL_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${PC_MYSQL_PASSWORD:-root}
      DB_HOST: host.docker.internal
      DB_PORT: ${PC_MYSQL_PORT:-3306}
      DB_NAME: ${AUTH_DB_NAME:-auth}
      DB_USERNAME: ${PC_MYSQL_USERNAME:-root}
      DB_PASSWORD: ${PC_MYSQL_PASSWORD:-root}
      JWT_PRIVATE_KEY_PATH: /keys/jwt-private.pem
      JWT_PUBLIC_KEY_PATH: /keys/jwt-public.pem
      JWT_AUDIENCE: ${JWT_AUDIENCE:-auth-clients}
      JWT_ISSUER: ${JWT_ISSUER:-http://localhost:8080/authorization-server/api}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-dev-internal-token}
      FRONTEND_BASE_URL: /authorization-server/api
      SHARITY_WEB_BFF_CLIENT_ID: ${SHARITY_WEB_BFF_CLIENT_ID:-sharity-web-bff}
      SHARITY_WEB_BFF_CLIENT_SECRET: ${SHARITY_WEB_BFF_CLIENT_SECRET:-change-me-local-only}
      SHARITY_BFF_PUBLIC_BASE_URL: ${SHARITY_BFF_PUBLIC_BASE_URL:-http://localhost:8080}
      SHARITY_FRONTEND_REGISTER_URL: ${SHARITY_FRONTEND_REGISTER_URL:-https://vinodbalakumar.com/app/register}
      SHARITY_FRONTEND_COMPLETE_REGISTRATION_URL: ${SHARITY_FRONTEND_COMPLETE_REGISTRATION_URL:-https://vinodbalakumar.com/app/complete-registration}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-https://vinodbalakumar.com/authorization-server/api/login/oauth2/code/google}
      APPLE_OAUTH_CLIENT_ID: ${APPLE_OAUTH_CLIENT_ID:-}
      APPLE_OAUTH_CLIENT_SECRET: ${APPLE_OAUTH_CLIENT_SECRET:-}
      APPLE_OAUTH_REDIRECT_URI: ${APPLE_OAUTH_REDIRECT_URI:-https://vinodbalakumar.com/authorization-server/api/v1/auth/social/apple/callback}
      SHARITY_WEB_ALLOWED_ORIGIN: ${SHARITY_WEB_ALLOWED_ORIGIN:-http://localhost:8081,http://192.168.0.200:8081,http://localhost:8082,http://192.168.0.200:8082}
      APP_PROFILE_IMAGE_STORAGE_PROVIDER_CODE: ${ASSET_STORAGE_PROVIDER_CODE:-CLOUDFLARE_R2_PRIMARY}
      APP_PROFILE_IMAGE_STORAGE_BUCKET_NAME: ${ASSET_STORAGE_BUCKET_NAME:-sharity-assets}
      APP_PROFILE_IMAGE_STORAGE_ENDPOINT_URL: ${ASSET_STORAGE_ENDPOINT_URL:-}
      APP_PROFILE_IMAGE_STORAGE_PUBLIC_BASE_URL: ${ASSET_STORAGE_PUBLIC_BASE_URL:-https://pub-c431ffbb16cd4884aa6a22a5f177f00b.r2.dev}
      APP_PROFILE_IMAGE_STORAGE_REGION: ${ASSET_STORAGE_REGION:-auto}
      APP_PROFILE_IMAGE_STORAGE_ACCESS_KEY_ID: ${ASSET_STORAGE_ACCESS_KEY_ID:-}
      APP_PROFILE_IMAGE_STORAGE_SECRET_ACCESS_KEY: ${ASSET_STORAGE_SECRET_ACCESS_KEY:-}
      APP_PROFILE_IMAGE_STORAGE_MAX_FILE_SIZE_BYTES: ${ASSET_UPLOAD_MAX_FILE_SIZE_BYTES:-5242880}
      AUTH_SESSION_COOKIE_SECURE: ${AUTH_SESSION_COOKIE_SECURE:-false}
      EMAIL_DELIVERY_ENABLED: ${EMAIL_DELIVERY_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-mail.smtp2go.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    volumes:
      - C:/Users/HP/projects/certs:/keys:ro
    expose:
      - "8080"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 768m

  platform-web-bff:
    build:
      context: ../platform-web-bff
      dockerfile: ../deployments/dockerfiles/platform-web-bff.Dockerfile
    image: platform-web-bff:latest
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: qa
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:${PC_MYSQL_PORT:-3306}/${AUTH_DB_NAME:-auth}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${PC_MYSQL_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${PC_MYSQL_PASSWORD:-root}
      DB_HOST: host.docker.internal
      DB_PORT: ${PC_MYSQL_PORT:-3306}
      BFF_DB_NAME: ${AUTH_DB_NAME:-auth}
      DB_USERNAME: ${PC_MYSQL_USERNAME:-root}
      DB_PASSWORD: ${PC_MYSQL_PASSWORD:-root}
      AUTH_SERVER_PUBLIC_BASE_URL: ${AUTH_SERVER_PUBLIC_BASE_URL:-http://localhost:8080/authorization-server/api}
      AUTH_SERVER_BASE_URL: http://authorization-server:8080/authorization-server/api
      SHARITY_WEB_BFF_CLIENT_ID: ${SHARITY_WEB_BFF_CLIENT_ID:-sharity-web-bff}
      SHARITY_WEB_BFF_CLIENT_SECRET: ${SHARITY_WEB_BFF_CLIENT_SECRET:-change-me-local-only}
      SHARITY_BFF_PUBLIC_BASE_URL: ${SHARITY_BFF_PUBLIC_BASE_URL:-http://localhost:8080}
      SHARITY_WEB_BASE_URL: ${SHARITY_WEB_BASE_URL:-http://localhost:8080/app/}
      SHARITY_WEB_ALLOWED_ORIGIN: ${SHARITY_WEB_ALLOWED_ORIGIN:-http://localhost:8080,http://localhost:8081,http://localhost:8082}
      BFF_SESSION_COOKIE_SECURE: ${BFF_SESSION_COOKIE_SECURE:-false}
      AUTHORIZATION_SERVER_BACKEND_URL: http://authorization-server:8080/authorization-server
      MARKETPLACE_SERVICE_BACKEND_URL: http://marketplace-service:8080/marketplace-service
      PAYMENT_SERVICE_BACKEND_URL: http://payment-service:8080/payment-service
      WALLET_SERVICE_BACKEND_URL: http://wallet-service:8080/wallet-service
    expose:
      - "8080"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512m

  marketplace-service:
    build:
      context: ../marketplace-service
      dockerfile: ../deployments/dockerfiles/marketplace-service.Dockerfile
    image: marketplace-service:latest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: qa
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:${PC_MYSQL_PORT:-3306}/${MARKETPLACE_DB_NAME:-marketplace_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${PC_MYSQL_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${PC_MYSQL_PASSWORD:-root}
      DB_HOST: host.docker.internal
      DB_PORT: ${PC_MYSQL_PORT:-3306}
      MARKETPLACE_DB_NAME: ${MARKETPLACE_DB_NAME:-marketplace_db}
      DB_USERNAME: ${PC_MYSQL_USERNAME:-root}
      DB_PASSWORD: ${PC_MYSQL_PASSWORD:-root}
      JWT_PUBLIC_KEY_PATH: /keys/jwt-public.pem
      JWT_AUDIENCE: ${RESOURCE_JWT_AUDIENCE:-auth-clients}
      AUTH_ISSUER_URL: ${AUTH_ISSUER_URL:-http://localhost:8080/authorization-server/api}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-dev-internal-token}
      AUTH_PROVIDER_ELIGIBILITY_INTERNAL_URL: http://authorization-server:8080/authorization-server/api/internal/api/v1
      PAYMENT_SERVICE_INTERNAL_URL: http://payment-service:8080/payment-service/internal/api/v1
      ASSET_STORAGE_PROVIDER_CODE: ${ASSET_STORAGE_PROVIDER_CODE:-CLOUDFLARE_R2_PRIMARY}
      ASSET_STORAGE_BUCKET_NAME: ${ASSET_STORAGE_BUCKET_NAME:-sharity-assets}
      ASSET_STORAGE_ENDPOINT_URL: ${ASSET_STORAGE_ENDPOINT_URL:-}
      ASSET_STORAGE_PUBLIC_BASE_URL: ${ASSET_STORAGE_PUBLIC_BASE_URL:-https://pub-c431ffbb16cd4884aa6a22a5f177f00b.r2.dev}
      ASSET_STORAGE_REGION: ${ASSET_STORAGE_REGION:-auto}
      ASSET_STORAGE_ACCESS_KEY_ID: ${ASSET_STORAGE_ACCESS_KEY_ID:-}
      ASSET_STORAGE_SECRET_ACCESS_KEY: ${ASSET_STORAGE_SECRET_ACCESS_KEY:-}
      ASSET_UPLOAD_MAX_FILE_SIZE_BYTES: ${ASSET_UPLOAD_MAX_FILE_SIZE_BYTES:-5242880}
      SPRING_FLYWAY_OUT_OF_ORDER: "true"
    volumes:
      - C:/Users/HP/projects/certs:/keys:ro
    expose:
      - "8080"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.25"
          memory: 640m

  payment-service:
    build:
      context: ../payment-service
      dockerfile: ../deployments/dockerfiles/payment-service.Dockerfile
    image: payment-service:latest
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: qa
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:${PC_MYSQL_PORT:-3306}/${PAYMENT_DB_NAME:-payment_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${PC_MYSQL_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${PC_MYSQL_PASSWORD:-root}
      DB_HOST: host.docker.internal
      DB_PORT: ${PC_MYSQL_PORT:-3306}
      PAYMENT_DB_NAME: ${PAYMENT_DB_NAME:-payment_db}
      DB_USERNAME: ${PC_MYSQL_USERNAME:-root}
      DB_PASSWORD: ${PC_MYSQL_PASSWORD:-root}
      JWT_PUBLIC_KEY_PATH: /keys/jwt-public.pem
      JWT_AUDIENCE: ${RESOURCE_JWT_AUDIENCE:-auth-clients}
      AUTH_ISSUER_URL: ${AUTH_ISSUER_URL:-http://localhost:8080/authorization-server/api}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-dev-internal-token}
      PAYMENT_GATEWAY_MODE: ${PAYMENT_GATEWAY_MODE:-mock}
      AUTH_PROVIDER_ELIGIBILITY_INTERNAL_URL: http://authorization-server:8080/authorization-server/api/internal/api/v1
      WALLET_SERVICE_INTERNAL_URL: http://wallet-service:8080/wallet-service/internal/api/v1
    volumes:
      - C:/Users/HP/projects/certs:/keys:ro
    expose:
      - "8080"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.25"
          memory: 640m

  wallet-service:
    build:
      context: ../wallet-service
      dockerfile: ../deployments/dockerfiles/wallet-service.Dockerfile
    image: wallet-service:latest
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: qa
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:${PC_MYSQL_PORT:-3306}/${WALLET_DB_NAME:-wallet_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${PC_MYSQL_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${PC_MYSQL_PASSWORD:-root}
      DB_HOST: host.docker.internal
      DB_PORT: ${PC_MYSQL_PORT:-3306}
      WALLET_DB_NAME: ${WALLET_DB_NAME:-wallet_db}
      DB_USERNAME: ${PC_MYSQL_USERNAME:-root}
      DB_PASSWORD: ${PC_MYSQL_PASSWORD:-root}
      JWT_PUBLIC_KEY_PATH: /keys/jwt-public.pem
      JWT_AUDIENCE: ${RESOURCE_JWT_AUDIENCE:-auth-clients}
      AUTH_ISSUER_URL: ${AUTH_ISSUER_URL:-http://localhost:8080/authorization-server/api}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-dev-internal-token}
    volumes:
      - C:/Users/HP/projects/certs:/keys:ro
    expose:
      - "8080"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.25"
          memory: 640m

  tesla-dashboard-services:
    profiles:
      - disabled-tesla
    build:
      context: ../tesla-dashboard-services
      dockerfile: ../deployments/dockerfiles/tesla-dashboard-services.Dockerfile
    image: tesla-dashboard-services:latest
    environment:
      SERVER_PORT: 8080
      DB_HOST: host.docker.internal
      DB_PORT: ${PC_MYSQL_PORT:-3306}
      DB_NAME: ${TESLA_DB_NAME:-tesla}
      DB_USERNAME: ${PC_MYSQL_USERNAME:-root}
      DB_PASSWORD: ${PC_MYSQL_PASSWORD:-root}
      JWT_PUBLIC_KEY_PATH: /keys/jwt-public.pem
      JWT_AUDIENCES: ${JWT_AUDIENCES:-auth-clients}
      TESLA_PROXY_BASE: ${TESLA_PROXY_BASE:-https://host.docker.internal:4443}
    volumes:
      - C:/Users/HP/projects/certs:/keys:ro
    expose:
      - "8080"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 768m
