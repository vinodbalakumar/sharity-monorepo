# REVIEW-ONLY snippet for the existing public server in projects/deployments/nginx/nginx.conf.
# Uses its existing sharity_app and platform_web_bff upstreams. Do not replace that server block.
# No DNS change. Do not expose /internal/chat, port 8086 or Ollama port 11434.
location = /chat {
    proxy_pass http://sharity_app/index.html;
    proxy_set_header Host $host;
    add_header Cache-Control "no-store" always;
}
location = /chat/ { return 302 /chat; }
location ^~ /bff/ai/ {
    client_max_body_size 8k;
    limit_req zone=api_limit burst=10 nodelay;
    proxy_pass http://platform_web_bff;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 100s;
    proxy_send_timeout 30s;
    add_header Cache-Control "no-store" always;
}
