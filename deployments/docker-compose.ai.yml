# Use with the two existing local files and the private .env.ai.local file.
# Release tags refer to the locally verified JARs and Expo export, not remote branch HEADs.
x-diagnostics: &diagnostics
  DIAGNOSTICS_ENABLED: "true"
  DIAGNOSTICS_URL: https://platform-web-bff:8443/internal/diagnostics/events
  DIAGNOSTICS_TOKEN: ${DIAGNOSTICS_TOKEN:?Private diagnostics token required}
  DIAGNOSTICS_SLOW_MS: "5000"
  OTEL_EXPORT_ENABLED: "false"
  LOGGING_LEVEL_ROOT: INFO
  LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB: WARN
  LOGGING_LEVEL_ORG_HIBERNATE_SQL: WARN
  LOGGING_LEVEL_ORG_HIBERNATE_ORM_JDBC_BIND: WARN
  SPRING_JPA_SHOW_SQL: "false"
  JAVA_TOOL_OPTIONS: -Djavax.net.ssl.trustStore=/run/sharity/java-cacerts -Djavax.net.ssl.trustStorePassword=changeit

x-trust-volumes: &trust-volumes
  - ${SHARITY_TLS_DIR:?Private TLS configuration required}/java-cacerts:/run/sharity/java-cacerts:ro
  - ${SHARITY_TLS_DIR}/TlsProbe.class:/run/sharity/TlsProbe.class:ro

services:
  authorization-server:
    image: authorization-server:release-${SHARITY_RELEASE:?Set verified release}
    volumes: *trust-volumes
    environment:
      <<: *diagnostics
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://127.0.0.1:8080/authorization-server/api/actuator/health >/dev/null || exit 1"]
      start_period: 120s
      interval: 15s
      timeout: 5s
      retries: 12
  marketplace-service:
    image: marketplace-service:release-${SHARITY_RELEASE}
    volumes: *trust-volumes
    environment:
      <<: *diagnostics
      COMMERCE_DEMO_PURCHASES_ENABLED: "false"
      APP_MARKETPLACE_QUERY_SLOW_LOGGING_ENABLED: "false"
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://127.0.0.1:8080/marketplace-service/actuator/health >/dev/null || exit 1"]
      start_period: 120s
      interval: 15s
      timeout: 5s
      retries: 12
  payment-service:
    image: payment-service:release-${SHARITY_RELEASE}
    volumes: *trust-volumes
    environment:
      <<: *diagnostics
      COMMERCE_DEMO_PURCHASES_ENABLED: "false"
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://127.0.0.1:8080/payment-service/actuator/health >/dev/null || exit 1"]
      start_period: 120s
      interval: 15s
      timeout: 5s
      retries: 12
  wallet-service:
    image: wallet-service:release-${SHARITY_RELEASE}
    volumes: *trust-volumes
    environment:
      <<: *diagnostics
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://127.0.0.1:8080/wallet-service/actuator/health >/dev/null || exit 1"]
      start_period: 120s
      interval: 15s
      timeout: 5s
      retries: 12
  platform-web-bff:
    image: platform-web-bff:release-${SHARITY_RELEASE}
    volumes: *trust-volumes
    environment:
      <<: *diagnostics
      CHAT_BFF_TOKEN: ${CHAT_BFF_TOKEN:?Private chat channel token required}
      APP_BACKENDS_AI_SERVICE: http://127.0.0.1:8086
      JWT_ISSUER: ${AUTH_SERVER_PUBLIC_BASE_URL:-https://vinodbalakumar.com/authorization-server/api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-auth-clients}
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://127.0.0.1:8080/actuator/health >/dev/null || exit 1"]
      start_period: 120s
      interval: 15s
      timeout: 5s
      retries: 12
  platform-ai-service:
    image: platform-ai-service:release-${SHARITY_RELEASE}
    volumes: *trust-volumes
    # The BFF uses loopback; AI/Ollama have no published host/public ports.
    network_mode: service:platform-web-bff
    depends_on:
      platform-web-bff:
        condition: service_healthy
    env_file: .env.ai.local
    environment:
      <<: *diagnostics
      SERVER_PORT: "8086"
      AI_SERVICE_PORT: "8086"
      AI_ENABLED: "true"
      AI_CHAT_PROVIDER: ollama
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_CHAT_MODEL: qwen3:1.7b
      OLLAMA_NUM_CTX: "2048"
      OLLAMA_NUM_PREDICT: "256"
      OLLAMA_KEEP_ALIVE: 15m
      CHAT_MAX_CONCURRENT_GENERATIONS: "2"
      SPRING_AI_OLLAMA_CHAT_NUM_THREAD: "4"
      SPRING_AI_OLLAMA_CHAT_NUM_BATCH: "128"
      AI_DATABASE_INIT: never
      AI_JWK_SET_URI: http://authorization-server:8080/authorization-server/api/oauth2/jwks
      JWT_ISSUER: ${AUTH_SERVER_PUBLIC_BASE_URL:-https://vinodbalakumar.com/authorization-server/api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-auth-clients}
      DIAGNOSTICS_AI_ENABLED: "true"
      FOUNDER_PUBLIC_EMAIL_APPROVED: "false"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512m
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://127.0.0.1:8086/actuator/health >/dev/null || exit 1"]
      start_period: 120s
      interval: 15s
      timeout: 5s
      retries: 12
  tesla-dashboard-services:
    image: tesla-dashboard-services:release-${SHARITY_RELEASE}
    volumes: *trust-volumes
    environment:
      <<: *diagnostics
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://127.0.0.1:8080/tesla-dashboard-services/api/actuator/health >/dev/null || exit 1"]
      start_period: 120s
      interval: 15s
      timeout: 5s
      retries: 12
  platform-diagnostics-gateway:
    image: nginx:1.27-alpine
    network_mode: service:platform-web-bff
    depends_on:
      platform-ai-service:
        condition: service_healthy
    volumes:
      - ${SHARITY_TLS_DIR}:/run/tls:ro
      - ./nginx/diagnostics-tls.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64m
    healthcheck:
      test: [CMD-SHELL, "nginx -t >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
  sharity-app:
    image: sharity-app:release-${SHARITY_RELEASE}
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://127.0.0.1/index.html >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
