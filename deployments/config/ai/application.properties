# Mac-hosted Ollama; the model is provisioned separately. Never download models at startup.
app.ai.enabled=true
spring.ai.model.chat=ollama
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://192.168.0.149:11434}
spring.ai.ollama.chat.model=qwen3:8b
spring.ai.ollama.chat.num-predict=1024
spring.ai.ollama.chat.num-ctx=8192
spring.ai.ollama.chat.temperature=0.3
spring.ai.ollama.chat.think=false
spring.ai.ollama.chat.keep-alive=${OLLAMA_KEEP_ALIVE:10m}
spring.ai.ollama.init.pull-model-strategy=never
spring.http.clients.connect-timeout=3s
spring.http.clients.read-timeout=90s
spring.http.reactiveclient.connect-timeout=3s
spring.http.reactiveclient.read-timeout=90s
# Ollama chooses Apple Silicon GPU placement. Do not set num-gpu/CPU thread overrides.
app.chat.catalog-location=file:/run/sharity/knowledge/catalog.json
app.chat.catalog-url=${AI_PUBLIC_CATALOG_URL:http://marketplace-service:8080/marketplace-service/api/v1/marketplace/listings}
