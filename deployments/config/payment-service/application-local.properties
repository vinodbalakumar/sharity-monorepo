# -----------------------------------------------------------------------------
# Payment Service - local developer profile
#
# Local development uses MySQL and local dependent service endpoints.
# -----------------------------------------------------------------------------

server.port=9095
spring.flyway.locations=classpath:db/migration

app.jwt.public-key-path=${user.home}/projects/certs/jwt-public.pem
app.jwt.issuer=http://localhost:9093/authorization-server/api
app.internal.service-token=${APP_INTERNAL_SERVICE_TOKEN:}
app.services.authorization-provider-eligibility-url=http://localhost:9093/authorization-server/api/internal/api/v1
app.services.wallet-internal-url=http://localhost:9096/wallet-service/internal/api/v1

# Runtime credentials are kept outside the service repositories.
spring.config.import=file:${BACKEND_LOCAL_CONFIG:${user.home}/projects/deployments/.env.backend-local.properties}
