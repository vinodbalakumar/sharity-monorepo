# -----------------------------------------------------------------------------
# Authorization Server - local developer profile
#
# Why this file exists:
# - local developers need predictable localhost ports and URLs
# - local machines use MySQL in this workspace
# - cookies must work over plain HTTP during development
# - verbose SQL/logging is useful while debugging
# -----------------------------------------------------------------------------

server.port=9093
server.forward-headers-strategy=framework
server.servlet.context-path=/authorization-server/api
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=Lax

spring.mail.host=mail.smtp2go.com
spring.mail.port=587
spring.mail.username=change-me
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.flyway.locations=classpath:db/migration

# Local development benefits from visible SQL and bind values.
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace
logging.level.org.springframework.web=info
logging.level.org.springframework.security=info
logging.level.com.java.vinod.authorization.server.service.UserService=debug
logging.level.com.java.vinod.authorization.server.exception.GlobalExceptionHandler=debug

# Local cross-service trust uses the shared dev token.
app.internal.service-token=${APP_INTERNAL_SERVICE_TOKEN:}

# Local OAuth redirect and frontend URLs point to the running workstation.
app.oauth2.web-bff.redirect-uri=http://localhost:9090/login/oauth2/code/sharity-web-bff
app.oauth2.native-clients.android.redirect-uri=com.vinod.sharity://oauth2redirect/android
app.oauth2.native-clients.ios.redirect-uri=com.vinod.sharity://oauth2redirect/ios
app.oauth2.native-clients.windows.redirect-uri=http://127.0.0.1:53682/sharity/windows-callback
app.oauth2.native-clients.macos.redirect-uri=http://127.0.0.1:53682/sharity/macos-callback

app.jwt.private-key-base64=
app.jwt.public-key-base64=
app.jwt.private-key-path=${user.home}/projects/certs/jwt-private.pem
app.jwt.public-key-path=${user.home}/projects/certs/jwt-public.pem
app.jwt.issuer=http://localhost:9093/authorization-server/api
app.jwt.audience=auth-clients
app.jwt.audiences=auth-clients,MARKETPLACE_API,PAYMENT_API,WALLET_API

app.tokens.expose-dev-tokens=true

app.email.delivery-enabled=false
app.email.max-attempts=3
app.email.from=no-reply@vinodbalakumar.com
app.email.from-name=Authorization Server
app.email.frontend-base-url=http://localhost:9174/app

app.social.frontend-register-url=http://localhost:9174/app/register
app.social.frontend-complete-registration-url=http://localhost:9174/app/complete-registration
app.social.frontend-login-success-url=http://localhost:9174/app/

app.web.allowed-origin=http://localhost:9173,http://localhost:9174
spring.servlet.multipart.max-file-size=${ASSET_UPLOAD_MAX_FILE_SIZE_BYTES:5242880}
spring.servlet.multipart.max-request-size=${ASSET_UPLOAD_MAX_FILE_SIZE_BYTES:5242880}

# These defaults preserve current local asset upload behavior.
app.profile-image-storage.provider-code=CLOUDFLARE_R2_PRIMARY
app.profile-image-storage.bucket-name=sharity-assets
app.profile-image-storage.endpoint-url=https://75beeb37d05b7246321551b1684495e5.r2.cloudflarestorage.com
app.profile-image-storage.public-base-url=https://pub-c431ffbb16cd4884aa6a22a5f177f00b.r2.dev
app.profile-image-storage.region=auto
app.profile-image-storage.access-key-id=${AUTH_PROFILE_IMAGE_ACCESS_KEY_ID:}
app.profile-image-storage.secret-access-key=${AUTH_PROFILE_IMAGE_SECRET_ACCESS_KEY:}
app.profile-image-storage.local-directory=C:/Users/HP/AppData/Local/Temp/sharity-profile-images
app.profile-image-storage.local-public-base-url=http://localhost:9093/authorization-server/api/v1/assets/profile-images

# Runtime credentials are kept outside the service repositories.
spring.config.import=file:${BACKEND_LOCAL_CONFIG:${user.home}/projects/springbootrestdemo/deployments/.env.backend-local.properties}
