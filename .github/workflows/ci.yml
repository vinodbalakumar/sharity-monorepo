name: Monorepo CI
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.affected.outputs.matrix }}
      any: ${{ steps.affected.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: npm run check:workspace
      - run: npm run test:tools
      - name: Determine affected components and API consumers
        id: affected
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: node tools/affected.mjs "$BASE" "$HEAD"
  verify:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: Verify ${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        if: matrix.kind == 'java'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: '${{ matrix.path }}/pom.xml'
      - name: Install component dependencies
        env:
          COMPONENT: ${{ matrix.name }}
        run: node tools/workspace.mjs install "$COMPONENT"
      - name: Verify component
        env:
          COMPONENT: ${{ matrix.name }}
        run: node tools/workspace.mjs verify "$COMPONENT"
      - name: Install browser engines
        if: matrix.kind == 'storefront'
        working-directory: sharity-app-ui
        run: npx playwright install --with-deps chromium webkit
      - name: Verify storefront purchase and discovery flows
        if: matrix.kind == 'storefront'
        working-directory: sharity-app-ui
        run: npx playwright test cart-badge.spec.ts catalog-integrity.spec.ts storefront-sections.spec.ts purchase-lifecycle.spec.ts --project=chromium --project=webkit --reporter=list
