name: Publish component image
on:
  workflow_dispatch:
    inputs:
      component:
        description: Independently build and publish one component
        type: choice
        required: true
        options:
          - authorization-server
          - marketplace-service
          - payment-service
          - wallet-service
          - platform-web-bff
          - platform-ai-service
          - sharity-app-ui
          - sharity-admin-portal
          - tesla-dashboard-services
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install and verify selected component
        env:
          COMPONENT: ${{ inputs.component }}
        run: |
          node tools/workspace.mjs install "$COMPONENT"
          node tools/workspace.mjs verify "$COMPONENT"
      - name: Resolve image metadata
        id: image
        env:
          COMPONENT: ${{ inputs.component }}
          REVISION: ${{ github.sha }}
        run: node tools/image-metadata.mjs "$COMPONENT" "$REVISION"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ${{ steps.image.outputs.context }}
          file: ${{ steps.image.outputs.dockerfile }}
          build-contexts: deployment=./deployments
          push: true
          tags: ${{ steps.image.outputs.image }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
